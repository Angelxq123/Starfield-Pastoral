// Run with: ./gradlew -I compatibility/npc-display-tests.gradle test
allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            sourceSets.test.java.setSrcDirs([file('compatibility/npc-display')])
            sourceSets.test.resources.setSrcDirs([])
            tasks.named('test') {
                include 'com/stardew/craft/client/ClientDisplayFallbacksTest.class'
                reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/npc-display')
                reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/npc-display')
            }
        }
    }
}
