// Run with: ./gradlew -I compatibility/npc-social-tests.gradle test
allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            sourceSets.test.java.setSrcDirs([file('compatibility/npc-social')])
            sourceSets.test.resources.setSrcDirs([file('compatibility/npc-social/fixtures')])
            tasks.named('test') {
                include 'com/stardew/craft/npc/data/NpcSocialRulesTest.class'
                reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/npc-social')
                reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/npc-social')
            }
        }
    }
}
